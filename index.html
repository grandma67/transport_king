<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1d4ed8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Transport King">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="description" content="Transport King: unblock the lot, park the right vehicle, and send every passenger on their way. Endless levels.">
  <title>Transport King</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <button class="hud-btn" id="btn-menu" aria-label="Menu">&#9776;</button>
      <div class="hud-mid">
        <div id="hud-level">Level 1</div>
        <div id="hud-theme"></div>
      </div>
      <div id="hud-stats" aria-live="polite">
        <span title="Vehicles left">&#128663; <b id="hud-cars">0</b></span>
        <span title="Passengers left">&#129485; <b id="hud-pass">0</b></span>
      </div>
      <button class="hud-btn" id="btn-restart" aria-label="Restart level">&#8635;</button>
    </header>
    <main id="stage"></main>
    <div id="toast" role="status"></div>
    <div id="overlay" class="hidden"></div>
  </div>
  <script src="js/levels.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
